name: Build and publish PMS update

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - main.cjs
      - preload.cjs
      - package.json
      - package-lock.json
      - supabase-setup.sql
      - scripts/prepare-release.cjs
      - scripts/create-release-notes.cjs
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pms-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Electron build tools
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: windows-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            windows-electron-

      - name: Prepare next version
        run: node scripts/prepare-release.cjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Vietnamese release notes
        run: node scripts/create-release-notes.cjs

      - name: Create and push release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git tag $tag
          git push origin $tag

      - name: Build Windows installer
        run: npm run dist:win:installer

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          gh release create "v$version" `
            "release/PMS-Enterprise-Setup-$version.exe" `
            "release/PMS-Enterprise-Setup-$version.exe.blockmap" `
            "release/latest.yml" `
            --title "$version" `
            --notes-file "release-notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
